<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GTU timetable by group, teacher and room. Works offline.">
  <title>Uni Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Uni Hub">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "@vercel/analytics": "./vendor/vercel-analytics.js"
      }
    }
  </script>
  <script src="vendor/sql-wasm.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Screen 1: splash -->
  <div id="splash" class="splash" aria-hidden="true">
    <img src="icons/splash-logo.svg" alt="" width="76" height="70">
  </div>

  <!-- Screen 2: search across groups, teachers and rooms -->
  <main id="search-page" class="page" hidden>
    <div class="search-top">
      <header class="page-head">
        <div>
          <h1 data-i18n="title">Uni Hub</h1>
          <p id="week-line" class="secondary"></p>
        </div>
        <div class="head-actions">
          <span id="offline" class="offline-pill" hidden data-i18n="offline">ოფლაინ</span>
          <button id="lang" class="lang" type="button" aria-label="Language">EN</button>
        </div>
      </header>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
               data-i18n-placeholder="searchPlaceholder">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </label>
    </div>

    <div id="results" class="results"></div>
  </main>

  <!-- Screen 3: one group's / teacher's / room's week -->
  <main id="week-page" class="page" hidden>
    <div class="week-top">
      <header class="week-head">
        <a class="back" href="#/" data-i18n-aria="back" aria-label="უკან">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <h1 id="week-name" class="week-title"></h1>
        <button id="fav" class="fav" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/></svg>
        </button>
      </header>
      <nav id="days" class="days" aria-label="Days"></nav>
    </div>
    <div id="lessons" class="lessons"></div>
  </main>

  <section id="error-page" class="page error" hidden>
    <img src="icons/splash-logo.svg" alt="" width="76" height="70">
    <p id="error-text"></p>
    <button id="retry" class="primary" type="button" data-i18n="retry">ხელახლა ცდა</button>
  </section>

  <!-- Mobile browsers only, on the search screen: how to add the site to the home screen -->
  <button id="a2hs" class="a2hs" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
    <span data-i18n="addToHome">დაამატე მთავარ ეკრანზე</span>
  </button>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-app">
      <h2 id="sheet-title" data-i18n="sheetTitle">Uni Hub შენს ეკრანზე</h2>
      <p class="secondary" data-i18n="sheetText">ცხრილი ერთი შეხებით გაიხსნება და ინტერნეტის გარეშეც იმუშავებს.</p>
    </div>
    <ol id="sheet-steps" class="steps"></ol>
    <button id="sheet-close" class="primary" type="button" data-i18n="gotIt">გასაგებია</button>
  </section>

  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
